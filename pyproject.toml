[project]
name = "slm"
version = "0.1.0"
description = "Small language model comparisons for RNN, LSTM, GRU, and Transformer architectures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.20",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.32",
    "torch>=2.4",
    "tqdm>=4.66",
    "wandb>=0.17",
]

[project.scripts]
slm-prepare = "slm.prepare_data:main"
slm-train = "slm.train:main"
slm-generate = "slm.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
