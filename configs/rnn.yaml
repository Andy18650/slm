model:
  type: rnn
  embedding_dim: 256
  hidden_dim: 256
  num_layers: 2
  dropout: 0.2

training:
  batch_size: 64
  sequence_length: 128
  learning_rate: 0.001
  weight_decay: 0.01
  epochs: 20
  steps_per_epoch: 500
  eval_interval: 500
  eval_iters: 30
  grad_clip: 1.0
  device: auto
  seed: 42
