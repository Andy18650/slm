model:
  type: split_state_rnn
  embedding_dim: 512
  hidden_dim: 512
  num_layers: 4

training:
  batch_size: 64
  sequence_length: 128
  learning_rate: 0.001
  weight_decay: 0.01
  steps: 10000
  train_log_interval: 50
  eval_interval: 500
  eval_iters: 30
  grad_clip: 1.0
  device: auto
  seed: 42
